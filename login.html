<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вход в админку — Margulis Business Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=JetBrains+Mono:wght@500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .login-page{min-height:100vh;display:flex;flex-direction:column}
  .login-header{border-bottom:1px solid var(--line);padding:27px 0}
  .login-main{flex:1;display:flex;align-items:center;padding:64px 0 100px}
  .login-grid{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,460px);gap:clamp(48px,9vw,140px);align-items:center}
  .login-intro h1{font:700 clamp(52px,7vw,104px)/.98 var(--display);letter-spacing:-.05em;margin:28px 0 22px}
  .login-intro p{color:var(--muted);font-size:19px;max-width:420px;line-height:1.5}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(25px,4vw,40px)}
  .login-card h2{font:600 28px/1.2 var(--display);margin:0 0 10px}
  .login-card .sub{color:var(--muted);margin:0 0 32px;font-size:15px}
  .login-field{display:block;margin-bottom:20px;font-size:14px;color:var(--muted)}
  .login-field input{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:15px 16px;font:inherit;font-size:16px}
  .login-field input:focus{outline:2px solid var(--accent);outline-offset:2px}
  .login-card button{width:100%;margin-top:8px;cursor:pointer}
  .login-card button:disabled{opacity:.65;cursor:wait}
  .login-error{color:#ffaaa9;font-size:14px;min-height:1.4em;margin:0 0 10px}
  .login-footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px}
  @media(max-width:760px){.login-main{padding:48px 0 64px}.login-grid{grid-template-columns:1fr;gap:32px}.login-intro h1{font-size:52px;margin:20px 0 14px}.login-intro p{font-size:16px}}
</style>
</head>
<body class="login-page">
<header class="login-header"><div class="wrap"><a class="logo" href="/"><span class="logo__mark"></span><span class="logo__text">Margulis Business Club</span></a></div></header>
<main class="login-main"><div class="wrap login-grid">
  <section class="login-intro"><span class="eyebrow eyebrow--accent">ПАНЕЛЬ УПРАВЛЕНИЯ / MARGULIS BUSINESS CLUB</span><h1>Всё для<br>вашего клуба<span style="color:var(--accent)">.</span></h1><p>Управляйте событиями и содержанием сайта в одном месте.</p></section>
  <section class="login-card"><h2>Вход в админку</h2><p class="sub">Введите данные администратора клуба.</p>
    <form id="login-form"><label class="login-field" for="username">Email<input id="username" name="username" type="email" autocomplete="username" required autofocus></label>
    <label class="login-field" for="password">Пароль<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <p class="login-error" id="error" role="alert" aria-live="polite"></p><button class="btn btn--accent btn--lg" type="submit">Войти в админку →</button></form>
  </section>
</div></main>
<footer class="login-footer"><div class="wrap">Margulis Business Club · <a href="/">Вернуться на сайт</a></div></footer>
<script>
document.getElementById('login-form').addEventListener('submit', async function (event) {
  event.preventDefault(); const button = this.querySelector('button'); const error = document.getElementById('error'); button.disabled = true; error.textContent = '';
  try { const response = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username:document.getElementById('username').value, password:document.getElementById('password').value }) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || 'Не удалось войти.'); location.replace('/admin'); }
  catch (e) { error.textContent = e.message || 'Не удалось связаться с сервером.'; button.disabled = false; }
});
</script>
</body>
</html>
